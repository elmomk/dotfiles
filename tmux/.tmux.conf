# -- Options --
setw -g mouse on
setw -g mode-keys vi
set -s default-terminal 'tmux-256color'
set -g extended-keys on
set -g focus-events on   # pass focus in/out to apps (nvim autoread/FocusGained, etc.)
set-option -sa terminal-overrides ',alacritty:RGB'
set -as terminal-features ',xterm-256color:RGB'   # truecolor when the outer term is Windows Terminal
set -as terminal-features '*:hyperlinks'   # pass OSC 8 links through to the terminal (ctrl+click)
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1

# Defaults tmux-sensible would have supplied; it is disabled below, so set them here.
set -s escape-time 10          # 500ms default delays every Esc in nvim
set -g detach-on-destroy off   # killing a session switches to another, not out of tmux
set -g renumber-windows on     # no index gaps after a window closes
set -g allow-passthrough on    # let OSC 52 and image protocols reach the outer terminal
# Deeper scrollback for capture-pane reads. Does not grow the resurrect archive:
# @resurrect-pane-contents-area 'visible' caps the save at screen height, not history.
set -g history-limit 10000

# -- Auto-install TPM --
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# -- Plugins --
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-copycat'
#set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-continuum'

# -- Session persistence --
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @yank_with_mouse on

# Restore scrollback text after a reboot, not just the layout. Helps shell/build/
# log panes; does NOT restore a Claude conversation — resurrect reads panes with
# capture-pane, which cannot see the alternate screen the TUI draws on.
# 'visible' caps it to the screen: the default 'full' saves every pane's entire
# scrollback on continuum's 15-minute timer, across 40+ worktree windows.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'

# -- Keybindings --
bind-key -r i display-popup -E "~/dotfiles/scripts/bin/cht.sh"
bind-key -r F display-popup -E "~/dotfiles/scripts/bin/tmux-sessionizer"
bind-key -r C display-popup -E "~/dotfiles/scripts/bin/tmux-win.sh"
# Session picker on a bare Alt+s — no prefix. Switching sessions is the most
# frequent thing done here, and a prefix on it costs a keystroke every time.
# Note this claims Alt+s inside every pane, so anything running in tmux that
# wanted Alt+s no longer sees it.
bind-key -n M-s display-popup -E "~/dotfiles/scripts/bin/tmux-fzf"
# Same picker on the prefix key as well. Kept from the pre-consolidation box
# state purely for muscle memory — M-s above is the one to reach for.
bind-key -r S display-popup -E "~/dotfiles/scripts/bin/tmux-fzf"
bind-key -r W display-popup -E "~/dotfiles/scripts/bin/tmux-fzf-win"
bind-key -r k display-popup -E "~/dotfiles/scripts/bin/tmux-fzf-kill"
# Not -r: tmux-sync toggles synchronize-panes, so a repeat keystroke undoes it.
bind-key r run-shell "~/dotfiles/scripts/bin/tmux-sync"
bind-key M display-popup -E -w 90% -h 75% "~/dotfiles/scripts/bin/mr-board"

# -- Fast last-window --
bind-key -n M-f last-window

# -- Alt+W mirrors prefix+w (window picker) --
bind-key -n M-w choose-tree -Zw

# -- Alt+( / Alt+) cycle sessions --
bind-key -n 'M-(' switch-client -p
bind-key -n 'M-)' switch-client -n

# -- Panes/windows inherit current path --
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -- Claude Code Attention Plugin --
# Prevent applications from overwriting window names via escape sequences
set -g allow-rename off

# Auto-name windows using the same label logic as pane-border-format:
# @bg_label if present, else pane_title.
#
# Who sets @bg_label / @bg_status (both are PANE options):
#   - scripts/.local/bin/spawn-agent — in this repo, so this works on a fresh
#     checkout. Sets running/done/failed as the agent progresses.
#   - extensions/bg-agent.ts in the pi-extention repo — a
#     separate repo and OPTIONAL; absent on a box without the pi extension.
# Both formats fall back to pane_title when unset, so a checkout with neither
# setter degrades to plain titles rather than blank labels.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{@bg_label},#{@bg_label},#{pane_title}}'

# Pane border labels: show @bg_label if present, else pane_title (setters above)
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[reverse],}#{pane_index}#[default] "#{?@bg_label,#{?#{==:#{@bg_status},done},#[fg=colour245],#{?#{==:#{@bg_status},failed},#[fg=red],#[fg=green]}}#{@bg_label}#[default],#{pane_title}}"'

# Prefix + L : prompt for a pane label (sets pane_title)
bind-key L command-prompt -p "Pane label:" "select-pane -T '%%'"

# Override rename-window to also mark the window as manually-named (sticky)
bind-key , command-prompt -I "#W" { rename-window "%%" ; set -w @auto-name off }

# Prefix + N : re-enable auto-naming for the current window. Must flip tmux's
# native automatic-rename back ON (the namer / a manual rename turns it off);
# @auto-name is just a marker, so clear it too.
bind-key N set-option -w automatic-rename on \; set-option -wu @auto-name \; display-message "auto-name: on"

# Prefix + A     : recap THIS window's Claude session -> terse keyword label
# Prefix + C-a   : recap EVERY window in the session (runs in parallel)
# Prefix + M-s   : name the SESSION after the topic its windows have in common.
#                  One model call for the whole session, not one per window,
#                  because it reads the window names A and C-a already wrote.
bind-key A   run-shell -b '~/bin/tmux-claude-name "#{session_name}:#{window_index}"' \; display-message "naming window…"
bind-key C-a run-shell -b '~/bin/tmux-claude-name -a' \; display-message "naming all windows…"
bind-key M-s run-shell -b '$HOME/.local/bin/tmux-claude-name-session "#{session_name}"' \; display-message "naming session…"

# Theme options: kanagawa-dragon, catppuccin-mocha, tokyonight, dracula
set -g @claude-theme 'catppuccin-mocha'
set -g @claude-popup-key 'G'
set -g @claude-done-popup 'on'
set -g @claude-nav-keys 'on'
set -g @claude-notify-platform 'windows'
set -g @plugin 'elmomk/tmux_cc_attention'

# -- Popup: live sysmon (prefix + m) --
bind-key m display-popup -E -w 70 -h 18 '~/bin/tmux-sysmon'

# -- Popup: ask Claude in auto mode (prefix + a) --
# Opens an interactive Claude (--permission-mode auto) in a popup, starting in
# the current pane's dir. Ask anything, e.g. "which window is on devportal!89 —
# switch to it"; tmux/select-window/switch-client run without prompts in auto mode.
# Exit Claude (Ctrl-D or /exit) to close the popup.
bind-key a display-popup -E -w 90% -h 85% -d "#{pane_current_path}" 'claude --permission-mode auto'

# -- Open GitLab MR-review dashboard in Windows browser (prefix + R) --
# Set MR_DASHBOARD_URL in your shell init to point at your GitLab instance.
bind-key R run-shell 'cmd.exe /c start "" "${MR_DASHBOARD_URL:-https://gitlab.com/dashboard/merge_requests}"' \; display-message "Opening MR dashboard…"

# -- Initialize TPM (keep at bottom) --
run '~/.tmux/plugins/tpm/tpm'

# Strip claude/pi icon prefix from tmux_cc_attention formats (post-TPM, since
# the plugin overwrites @claude-fmt-* at init and the daemon caches them).
run-shell '~/bin/tmux-cc-strip-icon'

# Re-apply the slash fix to tmux-resurrect (post-TPM, since a plugin update
# reverts it). Without it, sessions named parent/child save an empty pane
# archive and nothing reports the failure. Idempotent; no-op when already done.
run-shell '~/bin/tmux-resurrect-patch'

# Stop tmux_cc_attention's pane scanner from reporting a WORKING Claude session
# as stopped (post-TPM, since a plugin update reverts the patch). Its marker
# literals match nothing on current Claude Code, and it has no "unknown" verdict,
# so every non-matching pane fell through to "stopped". Idempotent; no-op when
# already applied. See the script header for the measurement.
run-shell '~/bin/claude-state-patch'

# prefix + U : TPM's own update binding, then re-apply both patches in the same
# step. TPM binds U during init, so this override must come after it (same reason
# as M-n below). Without it an update reverts them: every resurrect save produces
# an empty archive, and the daemon keeps calling working sessions stopped, until
# the next config reload.
bind-key U run-shell '~/.tmux/plugins/tpm/bindings/update_plugins && ~/bin/tmux-resurrect-patch; [ -x ~/bin/claude-state-patch ] && ~/bin/claude-state-patch'

# -- Two-line status: sysstat row on top, main bar below.
# Set AFTER TPM init because tmux_cc_attention forces `status on` during init,
# which would reset `status 2`.
set -g status 2

# Line 0 (top-most): K8s+MR left, date+time+disk centered, sysstat right.
set -g status-format[0] '#(~/bin/tmux-go-home-check)#[align=left] #(~/bin/tmux-sysstat left)#[align=centre]#[fg=#fab387]#(grep -qi microsoft /proc/version && echo WSL || echo DEV-SERVER)#[default] #[fg=#89b4fa]%a %m-%d#[default] #[fg=#cba6f7,bold]%H:%M#[default]  #(~/bin/tmux-sysstat disk)#[align=right]#(~/bin/tmux-sysstat right) '

# Line 1 (below): tmux's default status template — the normal main bar that
# uses status-left, window list, and status-right.
set -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# -- tmux-continuum: re-add the save timer --
# continuum has no timer of its own: continuum.tmux prepends
# `#(scripts/continuum_save.sh)` to status-right and relies on the status
# refresh to run it. tmux_cc_attention loads AFTER continuum (its @plugin line
# is further down this file) and sources themes/<name>.conf, whose line 19 is
# `set -g status-right ""` — an overwrite, not an append, so continuum's
# interpolation is destroyed and nothing ever saves. Restore is unaffected —
# it is a one-shot background script at server start (continuum_restore.sh),
# not a status interpolation — which is exactly why this box restored fine and
# replayed the same Friday snapshot every morning.
# Re-adding it here, post-TPM, is order-independent. Note the misleading
# evidence: @continuum-save-last-timestamp is also stamped once at server start
# by delay_saving_environment_on_first_plugin_load, so a "today" timestamp is
# not proof of a save.
#
# The flock is load-bearing, do not drop it. A status refresh spawns one #()
# job per client, so continuum_save.sh can start several times at once, and its
# own guard is racy: main() is
#   ... && enough_time_since_last_run_passed && acquire_lock
# — the interval check happens OUTSIDE the mkdir lock, and set_last_save_timestamp
# only runs after the lock is taken, so every instance in a burst reads the same
# stale timestamp before any of them writes it. Two of them then reach
# tmux-resurrect's save.sh inside one clock second, and that is destructive:
# resurrect_file_path() has one-second resolution, so the second run recomputes
# the SAME filename, overwrites it, compares it against `last` — which now IS
# that file — finds them identical and takes the `rm "$resurrect_file_path"`
# branch. The save file is deleted and `last` is left dangling, which breaks
# restore too. Measured 2026-09-07 on an isolated server: 25-way burst, 24/25
# rounds left a dangling `last` without the flock, 0/25 with it.
set -ag status-right '#(flock -n ~/.tmux/continuum-save.lock ~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)'

# -- cc-track: dashboard + status item --
# Append `cc N●/M` (busy / total live Claude sessions) to status-right, after
# whatever tmux_cc_attention has already appended. Silent when no sessions.
set -ag status-right " #($HOME/work/git/cc-track/cc-track status)"

# -- mr-board: my open MRs + unseen Jira updates (prefix+M opens the popup) --
# Badge is `MR:<n>` plus `⚡<k>` when k tickets changed since I last looked. Written
# by mr-board-refresh / the poller; silent-ish (just MR:0) when nothing's open.
set -ag status-right " #(cat $HOME/.cache/mr-board/badge 2>/dev/null)"

# -- crew: the script-first crew (crew tick writes state.json every 30 s) --
# `crew: ok`, or what needs you, is ready or is blind; `crew: stale` when the tick stopped.
set -ag status-right " #($HOME/.local/bin/crew badge 2>/dev/null)"

# Each timer refresh re-runs all 9 #(...) segments of both status lines; at 15 s
# the timer drives a third as many runs as at 5 s. Polled by it, so up to 15 s
# behind: the cc count, cc-track's pi adapter (limits: cc-track/README.md),
# the MR and crew badges, the CPU chip, the clock. The Claude attention badges are
# pushed (tmux redraws on any option change) and do not wait for it.
set -g status-interval 15

# Window-namer activity indicator: ~/bin/tmux-claude-name sets @cc_naming while
# it runs (a ~20s headless claude call), so flag it on the right. Silent (empty)
# when idle. Length bump leaves room for the transient badge.
set -g status-right-length 95
set -ag status-right '#{?@cc_naming,#[fg=#1e1e2e]#[bg=#f9e2af] ⟳ naming… #[default],}'
# prefix + T or Alt+T → full dashboard (live + today + totals) in a popup.
# Inside the popup, esc / space / q closes it.
bind-key T    display-popup -E -w 90% -h 80% '$HOME/work/git/cc-track/cc-track watch'
bind-key -n M-t display-popup -E -w 90% -h 80% '$HOME/work/git/cc-track/cc-track watch'

# Alt+u → Claude Code token usage: the current 5-hour block, today, burn per crew,
# and plan % as /usage last saw it. Alt rather than prefix+U, which is TPM's update
# binding (overridden further up). Like M-s, this claims a bare Alt+u inside every
# pane, so readline/zsh upcase-word no longer reaches the shell. New, not a
# duplicate: tmux_cc_attention (G / M-g) tracks window attention only, and cc-track
# (T / M-t) tracks time, not tokens.
# It sizes itself: a fixed 75% left seven blank rows under the frame on a 51-row
# client, so --popup opens it as tall as its frame, and the fixed one if that fails.
# [ $? -gt 128 ]: a popup torn down by a signal, its client gone, needs no fallback.
bind-key -n M-u run-shell -b '~/.local/bin/claude-usage --popup "#{client_name}" || [ $? -gt 128 ] || tmux display-popup -c "#{client_name}" -E -w 90% -h 75% ~/.local/bin/claude-usage'

# Alt+r → MR review dashboard popup (auto-sized to fit the cached content)
bind-key -n M-r run-shell -b '$HOME/.local/bin/mr-review-status --popup'

# Alt+a → MRs opened by the selfservice API (bot-authored, SIT + prod configs)
bind-key -n M-a run-shell -b '$HOME/.local/bin/selfservice-mr-status --popup'

# -- Alt+c → the crew command center --
# Every captain on the box, its workers, its merge requests and its queued wake
# events, plus which sessions actually have the crew hooks loaded. The crew was
# the one live system here with no window onto it: everything it knows was
# otherwise readable only by asking a Claude session and reading the reply.
#
# run-shell rather than display-popup, matching M-r and M-a above. Measured
# 2026-08-12: display-popup does NOT expand tmux formats (a #{pane_id} in its
# command arrives as the literal string) while run-shell does, and a popup has
# no TMUX_PANE at all — which is why the center reports the whole box rather
# than pretending to know whose crew you are looking at.
bind-key -n M-c run-shell -b '$HOME/.local/bin/crew-center --popup'

# -- Alt+o → back to the Claude session you were in before this one --
# Alt+backtick → the plain tmux last-session toggle, for comparison.
#
# Two keys because they answer different questions and the difference bites. This
# box had eight tmux sessions and several held more than one Claude window —
# `alloy` three, `devportal` two — and between two conversations inside ONE tmux
# session `switch-client -l` does nothing at all. It also lands on whatever window
# that session last had selected, which need not be the conversation you meant.
#
# So M-o ranks by `statusUpdatedAt` out of ~/.claude/sessions/<pid>.json and jumps
# to the exact `<session>:@<window>.%<pane>` recorded there, skipping any entry
# whose pane is gone — a registry entry outlives its process, measured 2026-08-11.
# Window and pane ids are server-global, so the jump needs no session qualifier and
# survives windows being closed in a way an index would not.
#
# #{client_name} is passed explicitly rather than letting switch-client infer the
# client: with several clients attached, an inferred one is wrong exactly when it
# matters. Synchronous run-shell, not -b, so a refusal ("only session with a live
# pane") arrives as a tmux message instead of vanishing.
bind-key -n M-o run-shell '$HOME/.local/bin/crew-last --client "#{client_name}"'
bind-key -n 'M-`' switch-client -l

# -- Alt+n → new window running a teammate-mode Claude (auto permissions) --
# MUST be after TPM init: the tmux_cc_attention plugin (@claude-nav-keys on)
# also binds M-n to a plain new-window, so we re-bind here to override it.
bind-key -n M-n new-window -c "#{pane_current_path}" 'claude --teammate-mode tmux --permission-mode auto'
