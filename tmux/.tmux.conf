# -- Options --
setw -g mouse on
setw -g mode-keys vi
set -s default-terminal 'tmux-256color'
set -g extended-keys on
set-option -sa terminal-overrides ',alacritty:RGB'
set -as terminal-features '*:hyperlinks'   # pass OSC 8 links through to the terminal (ctrl+click)
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1

# -- Auto-install TPM --
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# -- Plugins --
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-copycat'
#set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'tmux-plugins/tmux-open'
#set -g @plugin 'tmux-plugins/tmux-continuum'

# -- Session persistence --
set -g @resurrect-strategy-nvim 'session'
#set -g @continuum-restore 'on'
set -g @yank_with_mouse on

# -- Keybindings --
bind-key -r i display-popup -E "~/dotfiles/scripts/bin/cht.sh"
bind-key -r F display-popup -E "~/dotfiles/scripts/bin/tmux-sessionizer"
bind-key -r C display-popup -E "~/dotfiles/scripts/bin/tmux-win.sh"
bind-key -r S display-popup -E "~/dotfiles/scripts/bin/tmux-fzf"
bind-key -r W display-popup -E "~/dotfiles/scripts/bin/tmux-fzf-win"
bind-key -r k display-popup -E "~/dotfiles/scripts/bin/tmux-fzf-kill"
bind-key -r r run-shell "~/dotfiles/scripts/bin/tmux-sync"

# -- Fast last-window --
bind-key -n M-f last-window

# -- Alt+W mirrors prefix+w (window picker) --
bind-key -n M-w choose-tree -Zw

# -- Panes/windows inherit current path --
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -- Claude Code Attention Plugin --
# Prevent applications from overwriting window names via escape sequences
set -g allow-rename off

# Auto-name windows using the same label logic as pane-border-format:
# @bg_label (set by bg-agent spawn) if present, else pane_title.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{@bg_label},#{@bg_label},#{pane_title}}'

# Pane border labels: show @bg_label (set by bg-agent) if present, else pane_title
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[reverse],}#{pane_index}#[default] "#{?@bg_label,#{?#{==:#{@bg_status},done},#[fg=colour245],#{?#{==:#{@bg_status},failed},#[fg=red],#[fg=green]}}#{@bg_label}#[default],#{pane_title}}"'

# Prefix + L : prompt for a pane label (sets pane_title)
bind-key L command-prompt -p "Pane label:" "select-pane -T '%%'"

# Override rename-window to also mark the window as manually-named (sticky)
bind-key , command-prompt -I "#W" { rename-window "%%" ; set -w @auto-name off }

# Prefix + N : re-enable auto-naming for the current window
bind-key N set-option -w @auto-name on \; display-message "auto-name: on"

# Prefix + A     : recap THIS window's Claude session -> terse keyword label
# Prefix + C-a   : recap EVERY window in the session (runs in parallel)
bind-key A   run-shell -b '~/bin/tmux-claude-name "#{session_name}:#{window_index}"' \; display-message "naming window…"
bind-key C-a run-shell -b '~/bin/tmux-claude-name -a' \; display-message "naming all windows…"

# Theme options: kanagawa-dragon, catppuccin-mocha, tokyonight, dracula
set -g @claude-theme 'catppuccin-mocha'
set -g @claude-popup-key 'G'
set -g @claude-done-popup 'on'
set -g @claude-nav-keys 'on'
set -g @claude-notify-platform 'windows'
set -g @plugin 'elmomk/tmux_cc_attention'

# -- Popup: live sysmon (prefix + m) --
bind-key m display-popup -E -w 70 -h 18 '~/bin/tmux-sysmon'

# -- Open GitLab MR-review dashboard in Windows browser (prefix + R) --
# Set MR_DASHBOARD_URL in your shell init to point at your GitLab instance.
bind-key R run-shell 'cmd.exe /c start "" "${MR_DASHBOARD_URL:-https://gitlab.com/dashboard/merge_requests}"' \; display-message "Opening MR dashboard…"

# -- Initialize TPM (keep at bottom) --
run '~/.tmux/plugins/tpm/tpm'

# Strip claude/pi icon prefix from tmux_cc_attention formats (post-TPM, since
# the plugin overwrites @claude-fmt-* at init and the daemon caches them).
run-shell '~/bin/tmux-cc-strip-icon'

# -- Two-line status: sysstat row on top, main bar below.
# Set AFTER TPM init because tmux_cc_attention forces `status on` during init,
# which would reset `status 2`.
set -g status 2

# Line 0 (top-most): K8s+MR left, date+time centered, sysstat right.
set -g status-format[0] '#(~/bin/tmux-go-home-check)#[align=left] #(~/bin/tmux-sysstat left)#[align=centre]#[fg=#89b4fa]%a %m-%d#[default] #[fg=#cba6f7,bold]%H:%M#[default]#[align=right]#(~/bin/tmux-sysstat right) '

# Line 1 (below): tmux's default status template — the normal main bar that
# uses status-left, window list, and status-right.
set -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# -- cc-track: dashboard + status item --
# Append `cc N●/M` (busy / total live Claude sessions) to status-right, after
# whatever tmux_cc_attention has already appended. Silent when no sessions.
set -ag status-right " #(/home/momoyang/work/git/cc-track/cc-track status)"
# Refresh status-right every 5s so the count tracks new sessions promptly.
set -g status-interval 5
# prefix + T or Alt+T → full dashboard (live + today + totals) in a popup.
# Inside the popup, esc / space / q closes it.
bind-key T    display-popup -E -w 90% -h 80% '/home/momoyang/work/git/cc-track/cc-track watch'
bind-key -n M-t display-popup -E -w 90% -h 80% '/home/momoyang/work/git/cc-track/cc-track watch'

# Alt+r → MR review dashboard popup (auto-sized to fit the cached content)
bind-key -n M-r run-shell -b '/home/momoyang/.local/bin/mr-review-status --popup'
